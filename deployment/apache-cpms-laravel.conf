# Laravel at http://localhost/cpms/ (no php artisan serve).
#
# Alias /cpms to public/ only. The project root holds .env and source;
# mapping the URL there would let Apache serve those files directly.
#
# Install:
#   sudo cp deployment/apache-cpms-laravel.conf /etc/apache2/conf-available/cpms-laravel.conf
#   sudo a2enmod rewrite
#   sudo a2enconf cpms-laravel
#   sudo systemctl reload apache2

Alias /cpms /var/www/html/cpms/public

<Directory /var/www/html/cpms/public>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/cpms>
    <FilesMatch "^\.env|composer\.(json|lock)|\.git">
        Require all denied
    </FilesMatch>
</Directory>
