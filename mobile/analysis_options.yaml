include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Keep the sample lean; these would otherwise be warnings during a demo.
    avoid_print: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
