name: cpms_mobile
description: "Best CPMS field app — construction workers view assigned tasks and report progress."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP client for talking to the Laravel API.
  http: ^1.2.0
  # Simple ChangeNotifier state management.
  provider: ^6.1.0
  # Persist the auth token between launches.
  shared_preferences: ^2.2.0
  # Date formatting on task cards.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
